[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vocal-trainer-desktop"
version = "0.1.0"
description = "Treinamento vocal desktop com análise de afinação e recursos locais"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7", "pyqtgraph>=0.13.7,<0.15",
  "numpy>=2.1,<3", "scipy>=1.14,<2", "sounddevice>=0.5,<0.6",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]
spyder = ["spyder-kernels>=3.0,<3.2"]

[project.scripts]
vocal-trainer = "vocal_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/vocal_app/assets" = ["assets/*.json"]
"share/vocal_app/assets/sample_vocal" = ["assets/sample_vocal/*.mp3"]
"share/vocal_app/assets/tablaturas" = ["assets/tablaturas/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["hardware: requires physical input/output devices"]
